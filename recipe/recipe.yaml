schema_version: 1

context:
  name: dartsim
  version: "6.19.4"
  build_number: 1

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  - url: https://github.com/dartsim/dart/archive/v${{ version }}.tar.gz
    sha256: 627a6d21650427da634503829eba6c0c20887cd3441082eb44187fb3f9250150
    patches:
      - if: win
        then:
          # Disable tutorials and examples to save build time
          - patches/disable-tutorials-examples.patch
          # Avoid -A x64 for Ninja/NMake when building dartpy on Windows
          - patches/fix-setup-msvc-ninja.patch
          - patches/dartpy-build-temp-env.patch
          # Remove once an upstream release exports the MSVC two-phase parsing
          # option required by DART 6's public template headers.
          - patches/export-msvc-two-phase-option.patch
build:
  number: ${{ build_number }}

outputs:
  - package:
      name: dartsim-cpp
    build:
      script:
        file: ${{ "bld_cpp.bat" if win else "build_cpp.sh" }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - doxygen
        - ninja
        - if: win
          then: perl
        - pkg-config
      host:
        - assimp
        - bullet-cpp
        - console_bridge
        - eigen-abi-devel
        - fcl
        - fmt
        - if: not osx
          then: freeglut
        - imgui <1.92
        - ipopt
        - libboost-devel
        - if: linux
          then:
            - libgl-devel
            - libglu
        - libode
        - nlopt
        - octomap
        - openscenegraph
        - pagmo
        - pagmo-devel
        - tinyxml2
        - urdfdom
        - spdlog
      run:
        - eigen-abi-devel
        - octomap
        - spdlog
      run_exports:
        - ${{ pin_subpackage('dartsim-cpp', upper_bound='x.x') }}
      ignore_run_exports:
        from_package:
          - console_bridge
          - spdlog
    tests:
      - script:
          - cmake -S tests/cmake-consumer -B cmake-consumer-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          - cmake --build cmake-consumer-build
          - ctest --test-dir cmake-consumer-build --output-on-failure --no-tests=error
        files:
          recipe:
            - tests/cmake-consumer/
        requirements:
          run:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ stdlib('c') }}
            - cmake
            - ninja
      - downstream: gz-physics8

  - package:
      name: dartpy
    build:
      script:
        file: ${{ "bld_py.bat" if win else "build_py.sh" }}
      skip:
        # dartpy rebuilds DART for each Python variant on Windows; keep the
        # latest Python variants first (currently 3.14 and 3.13) while staying
        # under Azure's 6h job timeout with optimized Release builds.
        - (linux and match(python, "<3.12")) or (win and (match(python, "<3.13") or match(python, ">3.14")))
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - doxygen
        - ninja
        - if: win
          then: perl
        - pkg-config
        - if: build_platform != target_platform
          then:
            - cross-python_${{ target_platform }}
            - numpy
            - python
      host:
        # C++ deps
        - assimp
        - bullet-cpp
        - console_bridge
        - eigen >=3.3.4,<5
        - fcl
        - fmt
        - if: not osx
          then: freeglut
        - imgui <1.92
        - ipopt
        - libboost-devel
        - if: linux
          then:
            - libgl-devel
            - libglu
        - libode
        - nlopt
        - octomap
        - openscenegraph
        - pagmo
        - pagmo-devel
        - tinyxml2
        - urdfdom
        - spdlog
        - if: linux
          then: xorg-libxfixes
        # Python deps
        - numpy
        - pip
        - pybind11 >=2.13.6,<3
        - python
        - setuptools
        - wheel
      run:
        - if: linux
          then:
            - libgl
            - libglu
        - numpy
        - python
    tests:
      - python:
          imports:
            - dartpy
          pip_check: false

  - package:
      name: dartsim
    build:
      skip:
        - (linux and match(python, "<3.12")) or (win and (match(python, "<3.13") or match(python, ">3.14")))
    requirements:
      run:
        - ${{ pin_subpackage('dartsim-cpp', exact=True) }}
        - ${{ pin_subpackage('dartpy', exact=True) }}
        - python
        - numpy
      run_exports:
        - ${{ pin_subpackage('dartsim-cpp', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - dartpy
          pip_check: false
about:
  homepage: http://dartsim.github.io/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: The DART (Dynamic Animation and Robotics Toolkit) library provides data structures and algorithms for kinematic and dynamic applications in robotics and computer animation.
  description: The DART (Dynamic Animation and Robotics Toolkit) library provides data structures and algorithms for kinematic and dynamic applications in robotics and computer animation.
  repository: https://github.com/dartsim/dart

extra:
  feedstock-name: dartsim
  recipe-maintainers:
    - jeongseok-meta
    - jslee02
    - traversaro
    - wolfv
